<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1d1c">
  <title>Aya — 音を編む</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23222422'/%3E%3Cpath d='M14 47 31 15h5l15 32M21 34h23' fill='none' stroke='%23d7ad78' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" aria-busy="true">
    <header class="app-header">
      <a class="brand" href="/" aria-label="Aya ホーム"><span class="brand-mark">A</span><span>Aya<small>音を編む</small></span></a>
      <div class="project-identity"><input id="project-name" aria-label="曲名" value="Aya" maxlength="120"><span id="save-state">読み込み中…</span></div>
      <nav class="file-actions" aria-label="プロジェクト">
        <button data-action="new" title="空の曲を作る">新規</button><button data-action="open">開く</button><button data-action="save" class="subtle-accent">保存 <kbd>Ctrl S</kbd></button>
        <button data-action="export" class="export-button">書き出す <span aria-hidden="true">↗</span></button><button data-action="help" class="help-button" title="操作ガイド">使い方</button>
      </nav>
    </header>
    <section class="transport" aria-label="再生と曲の設定">
      <div class="transport-buttons"><button data-action="rewind" title="曲頭へ (Home)" aria-label="曲頭へ">|◀</button><button data-action="stop" title="停止 (Enter)" aria-label="停止">■</button><button data-action="play" id="play-button" class="play-button" title="再生・一時停止 (Space)">▶ <span>再生</span></button><button data-action="record" id="record-button" title="PC鍵盤の演奏を選択音型へ録音" aria-pressed="false"><span class="record-dot"></span><span>録音</span></button></div>
      <button class="position" data-action="seek-dialog" title="再生位置を指定"><span id="position">01 : 01 : 00</span><small>小節 · 拍 · 1/100拍</small></button>
      <label class="tempo-control"><span>BPM</span><input id="tempo" type="number" min="30" max="300" step="0.1" value="108" aria-label="テンポ"></label>
      <div class="transport-divider"></div>
      <label class="loop-toggle"><input id="loop-enabled" type="checkbox"><span>↻ ループ</span></label>
      <div class="loop-range"><label>始<input id="loop-start" type="number" min="1" step="0.25" value="1" aria-label="ループ開始小節"></label><span>—</span><label>終<input id="loop-end" type="number" min="1" step="0.25" value="5" aria-label="ループ終了小節"></label></div>
      <div class="transport-spacer"></div>
      <div class="master"><label>MASTER<input id="master-gain" type="range" min="0" max="2" step="0.01" value="0.8" aria-label="マスター音量"></label><div class="meters" aria-label="出力レベル"><i id="meter-left"></i><i id="meter-right"></i></div><span id="clip-indicator" title="出力が上限に達しています">CLIP</span></div>
    </section>
    <div class="notice" id="notice" role="status" hidden><span id="notice-text"></span><button data-action="dismiss-notice" aria-label="通知を閉じる">×</button></div>
    <main class="workspace">
      <section class="arrangement" aria-labelledby="arrangement-title">
        <div class="section-toolbar"><h1 id="arrangement-title">アレンジ</h1><button data-action="focus-arrangement" id="focus-arrangement">編曲を広く</button><div class="toolbar-spacer"></div><label class="compact-label">長さ <input id="song-bars" type="number" min="1" max="1024" value="16" aria-label="曲の長さ（小節）">小節</label><button data-action="tuning">音律 <span id="tuning-summary">12音</span></button><button data-action="fit-song">曲全体</button><label class="zoom-control">表示<input id="timeline-zoom" type="range" min="0.1" max="64" step="0.1" value="28" aria-label="タイムラインの拡大率"></label></div>
        <div class="arrange-body"><div class="track-column"><div class="track-column-title">TRACKS <button data-action="add-track" title="トラック追加">＋ 追加</button></div><div id="track-headers"></div></div><div class="timeline-scroll" id="timeline-scroll"><div id="timeline" class="timeline"><div id="ruler" class="ruler"></div><div id="timeline-lanes"></div><div id="arrange-playhead" class="playhead"><i></i></div></div></div></div>
        <div class="arrange-footer"><div class="history-buttons"><button data-action="undo" id="undo-button" title="元に戻す (Ctrl Z)">↶ 元に戻す</button><button data-action="redo" id="redo-button" title="やり直す (Ctrl Shift Z)">↷</button></div><span id="selection-summary">音型を選択するか、空いた場所をダブルクリック</span><div class="toolbar-spacer"></div><button data-action="add-pattern">＋ 音型を置く</button><button data-action="duplicate-clip" id="duplicate-clip">複製</button><button data-action="delete-clip" id="delete-clip" class="text-danger">削除</button></div>
      </section>
      <section class="editor" aria-labelledby="editor-title">
        <div class="section-toolbar editor-toolbar"><h2 id="editor-title">音型</h2><button data-action="focus-editor" id="focus-editor">音型を広く</button><div class="toolbar-spacer"></div><label class="compact-label">グリッド<select id="quantize" aria-label="ノートのグリッド"><option value="1">1拍</option><option value="0.5">1/2拍</option><option value="0.25" selected>1/4拍</option><option value="0.125">1/8拍</option><option value="0.3333333333">3連</option><option value="0">自由</option></select></label><label class="zoom-control">表示<input id="note-zoom" type="range" min="20" max="100" value="44" aria-label="音符の拡大率"></label><button data-action="keyboard" id="keyboard-button" aria-pressed="false">PC鍵盤</button><button data-action="fit-notes" title="音符が見える高さへ">音域を合わせる</button></div>
        <div id="pattern-edit-banner" class="pattern-edit-banner" hidden></div>
        <div class="piano-viewport" id="piano-viewport"><div id="piano" class="piano"><div id="piano-ruler" class="piano-ruler"></div><div id="piano-keys" class="piano-keys"></div><div id="note-grid" class="note-grid"></div><div id="notes"></div><div id="piano-playhead" class="piano-playhead"></div></div><div class="editor-empty" id="editor-empty"><span class="empty-mark">♪</span><strong>最初の音型を置きましょう</strong><p>トラックの空いた場所をダブルクリック。<br>音符を描くか、右の「規則で作る」から始められます。</p><button data-action="add-pattern" class="accent">＋ 音型を置く</button></div></div>
        <div class="note-toolbar" id="note-toolbar"><span id="note-selection-label">ダブルクリックで音符を追加 · 端をドラッグして長さを変更</span><div class="toolbar-spacer"></div><label>音高<input id="note-pitch" type="number" step="0.01" min="0" max="127" aria-label="音符の音高"></label><label>開始<input id="note-start" type="number" step="0.25" min="0" aria-label="音符の開始拍"></label><label>長さ<input id="note-duration" type="number" step="0.25" min="0.03125" aria-label="音符の長さ"></label><label>強さ<input id="note-velocity" type="number" step="0.01" min="0.01" max="1" aria-label="音符の強さ"></label><button data-action="delete-note" aria-label="選択音符を削除">削除</button></div>
      </section>
      <aside class="inspector" aria-label="編集パネル"><div class="inspector-tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="pattern">音型</button><button role="tab" aria-selected="false" data-tab="sound">音色</button><button role="tab" aria-selected="false" data-tab="automation">動き</button></div><div id="inspector-content" class="inspector-content"></div></aside>
    </main>
    <footer class="status-bar"><div class="engine-state"><i id="engine-led"></i><span id="engine-status">音声エンジンへ接続中</span></div><span id="compile-status">曲を読み込んでいます</span><div class="toolbar-spacer"></div><span id="keyboard-status">Space 再生 / 停止</span><span class="version" id="version">AYA</span></footer>
  </div>
  <input id="open-file" type="file" accept=".aya,.json,.mid,.midi,application/json,audio/midi" hidden><input id="wav-file" type="file" accept=".wav,audio/wav" hidden>
  <dialog id="modal"><div id="modal-content"></div><button class="dialog-close" data-action="close-modal" aria-label="閉じる">×</button></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
